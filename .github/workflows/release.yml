name: Build

# 构建与发布：
#  - 手动触发：三端（Windows / Linux / macOS）原生编译，产物作为 artifact 上传；
#  - 推送 v* tag：同上，并额外把安装包发布到 GitHub Release（自动更新读取这里）。
#
# 自动更新只支持 Windows：Release 中的 Windows 包必须同时包含主程序与 updater.exe，
# 命名固定为 CHMLFrp-SpeedTest-windows-amd64.zip，客户端按 GOOS/GOARCH 匹配。
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            runs-on: windows-latest
            artifact: CHMLFrp-SpeedTest-windows-amd64
          - os: macos
            runs-on: macos-latest
            artifact: CHMLFrp-SpeedTest-darwin-arm64
          - os: linux
            runs-on: ubuntu-22.04
            artifact: CHMLFrp-SpeedTest-linux-amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/**/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      # Linux: Wails WebKitGTK + systray 依赖
      - name: Install Linux dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libgl1-mesa-dev \
            libx11-dev \
            zip \
            pkg-config \
            build-essential

      # Windows: 装 NSIS，构建时同时产出安装包
      - name: Install NSIS (Windows)
        if: matrix.os == 'windows'
        run: choco install nsis -y --no-progress

      # 版本号单一来源：tag 直接用 tag，手动构建记为 dev。
      # 通过 -X main.version 注入，覆盖 wails.json 里的 productVersion。
      - name: Resolve version
        id: version
        shell: bash
        run: |
          ref="${GITHUB_REF_NAME}"
          if [[ "$ref" == v* ]]; then
            echo "value=$ref" >> "$GITHUB_OUTPUT"
          else
            echo "value=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        shell: bash
        run: wails build -clean -ldflags "-X main.version=${{ steps.version.outputs.value }}"

      # 更新辅助程序必须单独编译，随主程序一起放进 ZIP。
      - name: Build updater (Windows)
        if: matrix.os == 'windows'
        shell: bash
        run: go build -trimpath -ldflags "-s -w -H=windowsgui" -o build/bin/updater.exe ./cmd/updater

      - name: Build updater (Unix)
        if: matrix.os != 'windows'
        shell: bash
        run: go build -trimpath -ldflags "-s -w" -o build/bin/updater ./cmd/updater

      - name: Package (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/bin/CHMLFrp-SpeedTest.exe dist/
          Copy-Item build/bin/updater.exe dist/
          Compress-Archive -Path dist/*.exe -DestinationPath dist/CHMLFrp-SpeedTest-windows-amd64.zip
          Remove-Item dist/CHMLFrp-SpeedTest.exe, dist/updater.exe

      - name: Package (Linux)
        if: matrix.os == 'linux'
        run: |
          mkdir -p dist
          cp build/bin/CHMLFrp-SpeedTest dist/
          cp build/bin/updater dist/
          cd dist
          zip CHMLFrp-SpeedTest-linux-amd64.zip CHMLFrp-SpeedTest updater
          rm CHMLFrp-SpeedTest updater

      - name: Package (macOS)
        if: matrix.os == 'macos'
        run: |
          mkdir -p dist
          cd build/bin && zip -ry ../../dist/CHMLFrp-SpeedTest-darwin-arm64.zip CHMLFrp-SpeedTest.app

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*.zip
          if-no-files-found: error

  # 只有 tag 触发的构建才发布；手动构建只产出 artifact，不影响线上版本。
  release:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect packages
        run: |
          mkdir -p dist
          find artifacts -name '*.zip' -exec cp {} dist/ \;
          ls -lh dist

      # Release 的 body 就是客户端的更新公告，提交时请按
      # 「新增 / 优化 / 修复」分段书写 tag 的发布说明。
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
          draft: false
          prerelease: false
