name: Build

# 手动构建：在 Actions 页点 Run workflow 时，三端（Windows / Linux / macOS）原生
# 编译 CHMLFrp-SpeedTest 并打包，产物作为 artifact 上传供下载。
# 提交代码不会自动构建；需要时手动跑。
on:
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            runs-on: windows-latest
            artifact: CHMLFrp-SpeedTest-windows-amd64
          - os: macos
            runs-on: macos-latest
            artifact: CHMLFrp-SpeedTest-macos
          - os: linux
            runs-on: ubuntu-22.04
            artifact: CHMLFrp-SpeedTest-linux-amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/**/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      # Linux: Wails WebKitGTK + systray 依赖
      - name: Install Linux dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libgl1-mesa-dev \
            libx11-dev \
            pkg-config \
            build-essential

      # Windows: 装 NSIS，构建时同时产出安装包
      - name: Install NSIS (Windows)
        if: matrix.os == 'windows'
        run: choco install nsis -y --no-progress

      - name: Build
        run: wails build -clean

      - name: Package (Windows)
        if: matrix.os == 'windows'
        shell: bash
        run: |
          mkdir -p dist
          cp build/bin/CHMLFrp-SpeedTest.exe dist/CHMLFrp-SpeedTest-windows-amd64.exe

      - name: Package (Linux)
        if: matrix.os == 'linux'
        run: |
          mkdir -p dist
          tar -czf dist/CHMLFrp-SpeedTest-linux-amd64.tar.gz -C build/bin CHMLFrp-SpeedTest

      - name: Package (macOS)
        if: matrix.os == 'macos'
        run: |
          mkdir -p dist
          cd build/bin && zip -ry ../../dist/CHMLFrp-SpeedTest-macos-arm64.zip CHMLFrp-SpeedTest.app

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

      # 如需自动发布到 GitHub Release，再加 push.tags 触发与 Publish 步骤即可。
