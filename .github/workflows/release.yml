name: Build

# 构建与发布：
#  - 手动触发：三端（Windows / Linux / macOS）原生编译，产物作为 artifact 上传；
#  - 推送 v* tag：同上，并额外把安装包发布到 GitHub Release（自动更新读取这里）。
#
# 自动更新只支持 Windows：Release 中的 Windows 包必须同时包含主程序与 updater.exe，
# 命名固定为 CHMLFrp-SpeedTest-windows-amd64.zip，客户端按 GOOS/GOARCH 匹配。
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            runs-on: windows-latest
            artifact: CHMLFrp-SpeedTest-windows-amd64
          - os: macos
            runs-on: macos-latest
            artifact: CHMLFrp-SpeedTest-darwin-arm64
          - os: linux
            runs-on: ubuntu-22.04
            artifact: CHMLFrp-SpeedTest-linux-amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/**/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      # Linux: Wails WebKitGTK + systray 依赖
      - name: Install Linux dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libgl1-mesa-dev \
            libx11-dev \
            zip \
            pkg-config \
            build-essential

      # Windows: 装 NSIS，构建时同时产出安装包
      - name: Install NSIS (Windows)
        if: matrix.os == 'windows'
        run: choco install nsis -y --no-progress

      # 版本号单一来源：tag 直接用 tag，手动构建记为 dev。
      # 通过 -X main.version 注入，覆盖 wails.json 里的 productVersion。
      - name: Resolve version
        id: version
        shell: bash
        run: |
          ref="${GITHUB_REF_NAME}"
          if [[ "$ref" == v* ]]; then
            echo "value=$ref" >> "$GITHUB_OUTPUT"
          else
            echo "value=dev" >> "$GITHUB_OUTPUT"
          fi

      # 安装包的「文件属性」和「应用和功能」里的版本号取自 wails.json 的
      # info.productVersion（wails 没有对应的命令行参数），而程序内版本来自 tag。
      # 不同步的话安装包会一直显示 wails.json 里那个旧版本号。
      # 只在 tag 形如 v1.2.3 时才改：VIProductVersion 要求纯数字四段，dev 会构建失败。
      - name: Sync product version (Windows)
        if: matrix.os == 'windows'
        shell: bash
        run: |
          ref="${GITHUB_REF_NAME}"
          if [[ "$ref" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            ver="${ref#v}"
            sed -i 's/"productVersion": "[^"]*"/"productVersion": "'"$ver"'"/' wails.json
            grep -n 'productVersion' wails.json
          else
            echo "非正式 tag（$ref），保留 wails.json 里的 productVersion"
          fi

      # makensis 只有在主脚本带 UTF-8 BOM 时才把整棵 include 树按 UTF-8 解析；
      # 而 wails 生成的 wails_tools.nsh 含中文产品名且不带 BOM，缺了它就会报
      # "Bad text encoding: project.nsi:1"。这里兜底补齐，避免改文件时丢了 BOM 直接发不出包。
      - name: Ensure project.nsi has UTF-8 BOM (Windows)
        if: matrix.os == 'windows'
        shell: bash
        run: |
          f=build/windows/installer/project.nsi
          head -c 3 "$f" | od -An -tx1 | tr -d ' \n' | grep -q '^efbbbf' \
            && echo "BOM 已存在" \
            || { printf '\xef\xbb\xbf' | cat - "$f" > "$f.bom" && mv "$f.bom" "$f"; echo "已补 BOM"; }

      # 更新辅助程序必须在 wails build 之前编译：
      #  - wails build -clean 会清空 build/bin，所以放到 build/updater 下避让；
      #  - 自定义的 build/windows/installer/project.nsi 会用 File 把它打进安装包，
      #    makensis 在 wails build 末尾执行，此时文件必须已经存在。
      - name: Build updater (Windows)
        if: matrix.os == 'windows'
        shell: bash
        run: |
          mkdir -p build/updater
          go build -trimpath -ldflags "-s -w -H=windowsgui" -o build/updater/updater.exe ./cmd/updater

      - name: Build updater (Unix)
        if: matrix.os != 'windows'
        shell: bash
        run: |
          mkdir -p build/updater
          go build -trimpath -ldflags "-s -w" -o build/updater/updater ./cmd/updater

      - name: Build
        shell: bash
        run: |
          flags=""
          if [[ "${{ matrix.os }}" == "windows" ]]; then
            # -nsis 让 wails 在编译后调用 makensis 产出安装包；
            # -installscope user 装到 %LOCALAPPDATA%\Programs，静默自动更新不需要 UAC。
            flags="-nsis -installscope user"
          fi
          wails build -clean $flags -ldflags "-X main.version=${{ steps.version.outputs.value }}"

      - name: Package (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          # 绿色版：主程序 + 更新辅助程序，自动更新与老版本客户端都读这个 zip
          Copy-Item build/bin/CHMLFrp-SpeedTest.exe dist/
          Copy-Item build/updater/updater.exe dist/
          Compress-Archive -Path dist/CHMLFrp-SpeedTest.exe, dist/updater.exe `
            -DestinationPath dist/CHMLFrp-SpeedTest-windows-amd64.zip
          Remove-Item dist/CHMLFrp-SpeedTest.exe, dist/updater.exe
          # 安装版：wails 产出 *-installer.exe，重命名成客户端约定的资产名
          Move-Item build/bin/CHMLFrp-SpeedTest-amd64-installer.exe `
            dist/CHMLFrp-SpeedTest-windows-amd64-setup.exe
          Get-ChildItem dist | Format-Table Name, Length

      - name: Package (Linux)
        if: matrix.os == 'linux'
        run: |
          mkdir -p dist
          cp build/bin/CHMLFrp-SpeedTest dist/
          cp build/updater/updater dist/
          cd dist
          zip CHMLFrp-SpeedTest-linux-amd64.zip CHMLFrp-SpeedTest updater
          rm CHMLFrp-SpeedTest updater

      - name: Package (macOS)
        if: matrix.os == 'macos'
        run: |
          mkdir -p dist
          cd build/bin && zip -ry ../../dist/CHMLFrp-SpeedTest-darwin-arm64.zip CHMLFrp-SpeedTest.app

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          # Windows 会同时产出 zip（绿色版）与 setup.exe（安装版），其余平台只有 zip。
          path: dist/*
          if-no-files-found: error

  # 只有 tag 触发的构建才发布；手动构建只产出 artifact，不影响线上版本。
  release:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # body_path 是仓库内的相对路径，必须先把仓库取下来才读得到公告文件。
      # 少了这一步，Release 会创建成功但正文为空（action 对缺失文件只警告不报错）。
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect packages
        run: |
          mkdir -p dist
          find artifacts -type f \( -name '*.zip' -o -name '*.exe' \) -exec cp {} dist/ \;
          ls -lh dist

      # Release body 会原样展示在客户端的更新弹窗里（前端用 textContent 渲染，
      # 不做 Markdown 解析），因此固定从 .github/release-notes/current.md 读取，
      # 不用 generate_release_notes 自动生成的英文提交列表。
      # 发版流程：先编辑该文件 → 提交 → 再打 tag。
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: CHMLFrp 测速 ${{ github.ref_name }}
          files: dist/*
          body_path: .github/release-notes/current.md
          draft: false
          prerelease: false
