name: build

# 跨平台构建：Windows / macOS / Linux 三平台原生编译 CHMLFrp-SpeedTest。
# 触发：push 到主分支、打 v* tag、PR、手动。
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            runs-on: windows-latest
            artifact: CHMLFrp-SpeedTest-windows-amd64
          - os: macos
            runs-on: macos-latest
            artifact: CHMLFrp-SpeedTest-macos
          - os: linux
            runs-on: ubuntu-22.04
            artifact: CHMLFrp-SpeedTest-linux-amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/**/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      # Linux: Wails webview + systray 依赖
      - name: Install Linux dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libgl1-mesa-dev \
            libx11-dev \
            pkg-config \
            build-essential

      # Windows: 装 NSIS 以便同时输出安装器（exe 仍会产出）
      - name: Install NSIS (Windows)
        if: matrix.os == 'windows'
        run: choco install nsis -y --no-progress

      - name: Build
        run: wails build -clean

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/bin/*
          if-no-files-found: error
